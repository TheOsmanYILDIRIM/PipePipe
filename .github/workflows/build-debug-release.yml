name: Build Debug APK & Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: "temurin"
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: |
          cd PipePipeClient
          chmod +x gradlew

      - name: Create Persistent Signing Keystore
        run: |
          cd PipePipeClient/app
          keytool -genkeypair -alias gemini -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore gemini-signing.keystore \
            -storepass geminipass -keypass geminipass \
            -dname "CN=PipePipeGemini, OU=Gemini, O=AI, L=Istanbul, ST=Istanbul, C=TR"

      - name: Build Debug APK
        run: |
          cd PipePipeClient
          ./gradlew assembleDebug --stacktrace -DskipFormatKtlint

      - name: Prepare APKs for Release
        id: prepare_apk
        run: |
          mkdir -p release_assets
          cd PipePipeClient/app/build/outputs/apk/debug
          ls -la
          
          # Copy universal APK if available
          if [ -f *universal*.apk ]; then
            cp *universal*.apk ../../../../../release_assets/PipePipe-Gemini-universal-debug.apk
          fi
          
          # Copy arm64-v8a APK if available
          if [ -f *arm64-v8a*.apk ]; then
            cp *arm64-v8a*.apk ../../../../../release_assets/PipePipe-Gemini-arm64-v8a-debug.apk
          fi

          # Copy armeabi-v7a APK if available
          if [ -f *armeabi-v7a*.apk ]; then
            cp *armeabi-v7a*.apk ../../../../../release_assets/PipePipe-Gemini-armeabi-v7a-debug.apk
          fi

          # Fallback: copy any other apk if universal not created
          for f in *.apk; do
            if [ -f "$f" ]; then
              cp "$f" "../../../../../release_assets/PipePipe-Gemini-$f"
            fi
          done
          
          cd ../../../../../
          echo "tag_name=debug-$(date +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PipePipe-debug-apks
          path: release_assets/*.apk
          retention-days: 14

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_apk.outputs.tag_name }}
          name: "PipePipe Gemini AI Subtitles (${{ steps.prepare_apk.outputs.tag_name }})"
          body: |
            ### 🎬 PipePipe with Gemini AI Subtitle Translation
            
            This is an automated keyless debug clone build of PipePipe with integrated Gemini AI Subtitle Translation.
            
            #### 📱 APK Options:
            • **`PipePipe-Gemini-universal-debug.apk`** (⭐ **Recommended** - Compatible with **ALL** Android devices)
            • **`PipePipe-Gemini-arm64-v8a-debug.apk`** (For modern 64-bit ARM phones)
            • **`PipePipe-Gemini-armeabi-v7a-debug.apk`** (For 32-bit ARM phones)
            
            #### ✨ Features included:
            • **Gemini AI Subtitle Translation**: Real-time multi-format subtitle translation into your target language.
            • **Chunked Streaming**: Playback begins immediately as soon as the first batch of cues is translated.
            • **Independent Clone**: Can be installed alongside official PipePipe without uninstallation.
            • **In-Place Upgradable**: Signed with a persistent keystore, allowing future updates to install directly over this build.
            • **Universal Subtitle Engine**: Full support for WebVTT, SubRip (SRT), YouTube TimedText XML v1/v3, TTML, and YouTube JSON3.
            
            **Commit**: `${{ github.sha }}`
          files: |
            release_assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
