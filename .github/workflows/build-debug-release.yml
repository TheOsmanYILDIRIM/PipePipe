name: Build Release APK & Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: "temurin"
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: |
          cd PipePipeClient
          chmod +x gradlew

      - name: Verify Persistent Signing Keystore
        run: |
          if [ ! -f "PipePipeClient/app/gemini-signing.keystore" ]; then
            echo "Keystore not found, generating fallback..."
            cd PipePipeClient/app
            keytool -genkeypair -alias gemini -keyalg RSA -keysize 2048 -validity 10000 \
              -keystore gemini-signing.keystore \
              -storepass geminipass -keypass geminipass \
              -dname "CN=PipePipeGemini, OU=Gemini, O=AI, L=Istanbul, ST=Istanbul, C=TR"
          else
            echo "Found fixed permanent gemini-signing.keystore."
          fi

      - name: Build Release APK
        run: |
          cd PipePipeClient
          ./gradlew assembleRelease --stacktrace -DskipFormatKtlint

      - name: Prepare APK for Release
        id: prepare_apk
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release_assets"
          APK_FILE=$(find PipePipeClient/app/build/outputs/apk/release -name "*arm64-v8a*.apk" -o -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No Release APK found!"
            exit 1
          fi
          echo "Selected APK: $APK_FILE"
          cp "$APK_FILE" "$GITHUB_WORKSPACE/release_assets/PipePipe-Gemini-arm64-v8a-release.apk"
          echo "tag_name=release-$(date +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PipePipe-arm64-v8a-release-apk
          path: release_assets/PipePipe-Gemini-arm64-v8a-release.apk
          retention-days: 14

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_apk.outputs.tag_name }}
          name: "PipePipe Gemini AI Subtitles Release (${{ steps.prepare_apk.outputs.tag_name }})"
          body: |
            ### 🎬 PipePipe with Gemini AI Subtitle Translation (Release Build)
            
            This is a permanent release build of PipePipe with integrated Gemini AI Subtitle Translation, signed with a fixed persistent keystore for seamless in-place updates.
            
            #### 📱 APK Download:
            • **`PipePipe-Gemini-arm64-v8a-release.apk`** (Optimized 64-bit ARM Android Release APK)
            
            #### ✨ Key Features & Improvements:
            • **Fixed Signing Key**: Permanently signed with a persistent keystore, allowing future updates to install directly over this build without signature errors.
            • **Multi-Chunk Resilience**: Robust chunk-by-chunk translation loop with smart 429 quota backoff and automatic retry.
            • **Custom Model Support**: Choose from preset Gemini models or enter any custom model name manually in Settings.
            • **Safety Filter Bypass**: Automatically sets `BLOCK_NONE` so movie/video subtitles are never blocked.
            • **Independent Clone**: Can be installed side-by-side with official PipePipe (`InfinityLoop1309.NewPipeEnhanced.gemini`).
            
            **Commit**: `${{ github.sha }}`
          files: |
            release_assets/PipePipe-Gemini-arm64-v8a-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
