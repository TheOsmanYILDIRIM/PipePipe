name: Build Debug APK & Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: "temurin"
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: |
          cd PipePipeClient
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd PipePipeClient
          ./gradlew assembleDebug --stacktrace -DskipFormatKtlint

      - name: Prepare APK for Release
        id: prepare_apk
        run: |
          mkdir -p release_assets
          # Find universal or arm64 or any generated debug apk
          APK_PATH=$(find PipePipeClient/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found!"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" release_assets/PipePipe-Gemini-debug.apk
          echo "tag_name=debug-$(date +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PipePipe-debug-apk
          path: release_assets/PipePipe-Gemini-debug.apk
          retention-days: 14

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_apk.outputs.tag_name }}
          name: "PipePipe with Gemini AI Subtitle Translation (${{ steps.prepare_apk.outputs.tag_name }})"
          body: |
            ### 🎬 PipePipe with Gemini AI Subtitle Translation
            
            This is an automated keyless debug build of PipePipe with integrated Gemini AI Subtitle Translation.
            
            #### ✨ Features included:
            • **Gemini AI Subtitle Translation**: Real-time multi-format subtitle translation into your target language.
            • **Chunked Streaming**: Playback begins immediately as soon as the first batch of cues is translated.
            • **Modular Clean Architecture**: Separate `gemini_subtitles.db` database & decoupled `org.schabi.newpipe.gemini` package for painless upstream synchronization.
            • **Universal Subtitle Engine**: Full support for WebVTT, SubRip (SRT), YouTube TimedText XML v1/v3, TTML, and YouTube JSON3.
            • **Settings**: Easily configure your API key, model selection, and chunk sizes in app settings.
            
            **Commit**: `${{ github.sha }}`
          files: |
            release_assets/PipePipe-Gemini-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
